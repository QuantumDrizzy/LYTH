[package]
name = "lyth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The LYTH compiler: build, run and check a .lyth source file."

[[bin]]
name = "lyth"
path = "src/main.rs"

[dev-dependencies]
lyth-lang = { path = "../lyth-lang" }
lyth-ptx = { path = "../lyth-ptx" }
lyth-uasm = { path = "../lyth-uasm" }
# The generated binding in tests/generated/ is compiled by the test suite, which is how a
# binding that stops compiling fails the build instead of being found by whoever uses it.
lyth-cuda = { path = "../lyth-cuda" }
tempfile = "3"

[dependencies]
lyth-lang = { path = "../lyth-lang" }
lyth-ptx = { path = "../lyth-ptx" }
lyth-uasm = { path = "../lyth-uasm" }
lyth-cuda = { path = "../lyth-cuda" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
